spring:
  application:
    name: puncher-manager
  # Long-lived SSE (/api/notification/stream): avoid Tomcat/async cutting the stream at ~30s idle.
  mvc:
    async:
      request-timeout: 24h
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:puncher_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:elmaarpro@gmail.com}
    password: ${MAIL_PASSWORD:rosl trls bcms cwwc}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-for-production-min-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  # Used in emails (weekly schedule links). Browser URL of the Next.js app.
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  # Optional override when spring.mail.username should not be the From address
  mail:
    from: ${MAIL_FROM:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    persist-authorization: true

logging:
  level:
    com.punchermanager: INFO
    org.springframework.security: INFO

# Demo / analytics seeding (off by default). Enable with env PUNCHER_SEED_ENABLED=true
puncher:
  seed:
    enabled: false
    generateAttendanceRecords: true
    analytics: true
    analyticsAbsentDays: true
  attendance-risk:
    enabled: true
    cron: "0 0 8 * * *"
